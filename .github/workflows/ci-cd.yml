name: Frontend CI/CD

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build production bundle
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

  deploy:
    name: Trigger Vercel deployment
    needs: test
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/features' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
      VERCEL_HEALTHCHECK_URL: ${{ secrets.VERCEL_HEALTHCHECK_URL }}
    steps:
      - name: Check Vercel healthcheck configuration
        if: ${{ env.VERCEL_HEALTHCHECK_URL == '' }}
        run: |
          echo "::warning::VERCEL_HEALTHCHECK_URL is not configured; deployment health verification was skipped."

      - name: Trigger Vercel deploy hook
        if: ${{ env.VERCEL_DEPLOY_HOOK_URL != '' }}
        run: curl --fail --silent --show-error -X POST "$VERCEL_DEPLOY_HOOK_URL"

      - name: Verify Vercel deployment health
        if: ${{ env.VERCEL_HEALTHCHECK_URL != '' }}
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 10 "$VERCEL_HEALTHCHECK_URL" > /dev/null; then
              echo "Vercel health check passed on attempt $attempt"
              exit 0
            fi
            echo "Vercel is not healthy yet (attempt $attempt/30)"
            sleep 10
          done
          echo "Vercel health check failed: $VERCEL_HEALTHCHECK_URL"
          exit 1

      - name: Explain skipped deploy hook
        if: ${{ env.VERCEL_DEPLOY_HOOK_URL == '' }}
        run: echo "VERCEL_DEPLOY_HOOK_URL is not configured; Vercel Git integration may deploy this commit instead."
